name: Python CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install black ruff pytest

      - name: Check code format
        run: |
          black --check .

      - name: Run linting
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          pytest
